<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<script src="config.js"></script>
<script>(function(){try{var m=localStorage.getItem('nid-night'),h=new Date().getHours();if(m==='on'||(m==='auto'&&(h>=22||h<7)))document.documentElement.setAttribute('data-theme','night')}catch(e){}})()</script>
<meta name="theme-color" content="#2B7A74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EEF3F4;--surface:#fff;--ink:#1B2830;--mute:#62727C;--line:#D9E2E5;--accent:#2B7A74;--onacc:#fff;--warm:#E39A2D;--soft:#DDEBEA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10171B;--surface:#192228;--ink:#E6EEF0;--mute:#8FA1AA;--line:#2A363D;--accent:#5CC2B8;--onacc:#0C1517;--warm:#F0B054;--soft:#1F3330}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10171B;--surface:#192228;--ink:#E6EEF0;--mute:#8FA1AA;--line:#2A363D;--accent:#5CC2B8;--onacc:#0C1517;--warm:#F0B054;--soft:#1F3330}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:18px;font-weight:800;margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{background:var(--soft);border-radius:18px;padding:16px;margin-bottom:14px}
.status b{font-weight:800}
.status p{margin:2px 0}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big button{border:0;border-radius:20px;padding:22px 8px;font-weight:800;font-size:17px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.big button span{font-size:30px}
.big button:active{transform:scale(.97);background:var(--soft)}
.big .feed{background:var(--warm);color:#2A1B00;box-shadow:none}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:inset 0 0 0 1px var(--line)}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.row .t{flex:1}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);background:none;flex:none;display:grid;place-items:center;font-weight:800;color:var(--onacc)}
.done .chk{background:var(--accent);border-color:var(--accent)}
.who{border:0;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;background:var(--soft);color:var(--ink)}
.who.moi{background:var(--accent);color:var(--onacc)}
.del{border:0;background:none;color:var(--mute);font-size:20px;padding:0 4px}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.add button,.ghost{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--onacc)}
.ghost{background:none;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line);margin-top:10px;font-size:14px;padding:8px 12px}
.time{color:var(--mute);font-size:14px;min-width:46px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button[aria-current="true"]{color:var(--accent)}
.hidden{display:none}
.empty{color:var(--mute);padding:8px 2px}
.pri{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--onacc)}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.qrow input,.add select,.ein{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.qrow input{width:90px}
.qrow .ghost{margin-top:0}
.add select{flex:none}
.ein{flex:1;min-width:0}
.sm{display:block;color:var(--mute);font-size:14px}
.row.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.sel .chk{background:var(--accent);border-color:var(--accent)}
.srow{display:grid;grid-template-columns:44px 1fr 74px;gap:10px;align-items:center;margin:6px 0}
.sbar{height:12px;border-radius:99px;background:var(--accent)}
.sbar.w{background:var(--warm)}
.sv{text-align:right;font-size:14px;color:var(--mute)}
:root[data-theme="night"]{color-scheme:dark;--bg:#0A0604;--surface:#140C08;--ink:#D9956A;--mute:#A9724C;--line:#2A1A11;--accent:#C2703F;--onacc:#140A05;--warm:#8F4F1F;--soft:#1A0F0A}
:root[data-theme="night"] .big .feed{color:#FFE9D2}
:root[data-theme="night"] .big button{padding:30px 8px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="bebe"><span>🍼</span>Bébé</button>
  <button data-tab="maison"><span>🏠</span>Maison</button>
  <button data-tab="repas"><span>🍽️</span>Repas</button>
  <button data-tab="demarches"><span>📋</span>Démarches</button>
  <button data-tab="sante"><span>🩺</span>Santé</button>
</nav>
<script>
var KEY='nid-v1';
var DEFAULT={tab:'bebe',baby:[],
tasks:[{id:1,text:'Faire les courses',who:'moi',done:false},{id:2,text:'Lancer une lessive',who:'elle',done:false},{id:3,text:'Sortir les poubelles',who:'moi',done:false},{id:4,text:'Préparer les repas de la semaine',who:'elle',done:false}],
steps:{},todo:null,meals:[],custom:[],shop:{},appts:[],care:{birth:'2027-05-06',done:{}}};
var S=load();var pend=false,editing=null;
/* --- Synchronisation (capacité db) : un document par élément, écrit seulement si modifié --- */
var DB=null,ready=false,sErr=false,nFirst=0,mir={tasks:{},todo:{},custom:{},baby:{},appts:{},sel:'',shop:'',care:''};
function idOf(x){return String(x.id||('e'+x.ts))}
function listOf(c){return c==='tasks'?S.tasks:c==='todo'?S.todo:c==='custom'?S.custom:c==='appts'?S.appts:S.baby}
function fail(e){sErr=true;try{console.error(e)}catch(x){}}
function sync(){
  if(!DB||!ready)return;
  ['tasks','todo','custom','baby','appts'].forEach(function(c){
    var cur={},m=mir[c];
    listOf(c).forEach(function(x){cur[idOf(x)]=JSON.stringify(x)});
    Object.keys(cur).forEach(function(k){if(m[k]!==cur[k]){m[k]=cur[k];DB.doc(c+'/'+k).set(JSON.parse(cur[k])).catch(fail)}});
    Object.keys(m).forEach(function(k){if(!(k in cur)){delete m[k];DB.doc(c+'/'+k).delete().catch(fail)}});
  });
  var s=JSON.stringify(S.meals),h=JSON.stringify(S.shop);
  if(s!==mir.sel){mir.sel=s;DB.doc('meals/sel').set({ids:S.meals}).catch(fail)}
  if(h!==mir.shop){mir.shop=h;DB.doc('meals/shop').set({c:S.shop}).catch(fail)}
  var cs=JSON.stringify(S.care);if(cs!==mir.care){mir.care=cs;DB.doc('meta/care').set(JSON.parse(cs)).catch(fail)}
}
function soft(){var a=document.activeElement;if(!pend&&!(a&&a.matches&&a.matches('input,select')))render()}
function listen(q,fn){var first=true;q.onSnapshot(function(snap){fn(snap);save();if(first){first=false;nFirst++;if(nFirst===8)ready=true}soft()},fail)}
function subscribe(){
  function col(c,fn){listen(c==='baby'?DB.collection('baby').orderBy('ts','desc').limit(400):DB.collection(c),function(snap){var arr=[],m={};snap.docs.forEach(function(d){var v=d.data();if(v){arr.push(v);m[d.id]=JSON.stringify(v)}});mir[c]=m;fn(arr)})}
  var byId=function(a,b){return String(a.id)<String(b.id)?-1:1};
  col('tasks',function(a){S.tasks=a.sort(function(x,y){return Number(x.id)-Number(y.id)})});
  col('todo',function(a){S.todo=a.sort(byId)});
  col('custom',function(a){S.custom=a.sort(byId)});
  col('baby',function(a){S.baby=a.reverse()});
  listen(DB.doc('meals/sel'),function(s){var d=s.exists?s.data():null;S.meals=(d&&d.ids)||[];mir.sel=JSON.stringify(S.meals)});
  listen(DB.doc('meals/shop'),function(s){var d=s.exists?s.data():null;S.shop=(d&&d.c)||{};mir.shop=JSON.stringify(S.shop)});
  col('appts',function(a){S.appts=a.sort(byId)});
  listen(DB.doc('meta/care'),function(s){var d=s.exists?s.data():null;if(d){S.care=d;if(!S.care.done)S.care.done={}}mir.care=JSON.stringify(S.care)});
}
function start(){
  migrate();
  DB.doc('meta/init').get().then(function(s){
    if(s.exists)return;
    var ps=[];
    ['tasks','todo','custom','baby','appts'].forEach(function(c){listOf(c).forEach(function(x){ps.push(DB.doc(c+'/'+idOf(x)).set(JSON.parse(JSON.stringify(x))))})});
    ps.push(DB.doc('meals/sel').set({ids:S.meals}));ps.push(DB.doc('meals/shop').set({c:S.shop}));
    return Promise.all(ps).then(function(){return DB.doc('meta/init').set({done:true})});
  }).then(subscribe).catch(function(e){fail(e);DB=null;render()});
}
/* --- Firebase (Firestore + connexion anonyme), sans outil de build --- */
var FBU='https://www.gstatic.com/firebasejs/13.1.0/';
function getCode(){try{return localStorage.getItem('nid-foyer')||''}catch(e){return ''}}
function setCode(c){try{if(c)localStorage.setItem('nid-foyer',c);else localStorage.removeItem('nid-foyer')}catch(e){}}
function cfgOk(){var c=window.NID_CONFIG;return !!(c&&c.apiKey&&c.apiKey.indexOf('REMPLIR')<0)}
function newCode(){var a=new Uint8Array(20),c='abcdefghjkmnpqrstuvwxyz23456789',r='';crypto.getRandomValues(a);for(var i=0;i<a.length;i++)r+=c[a[i]%c.length];return r}
function wrap(x){return{exists:x.exists(),data:function(){return x.data()}}}
function makeDB(fs,db,code){
  var base='families/'+code+'/';
  return{
    doc:function(p){var r=fs.doc(db,base+p);return{
      set:function(v){return fs.setDoc(r,v)},
      get:function(){return fs.getDoc(r).then(wrap)},
      delete:function(){return fs.deleteDoc(r)},
      onSnapshot:function(cb,err){return fs.onSnapshot(r,function(x){cb(wrap(x))},err)}}},
    collection:function(c){var cons=[];var o={
      orderBy:function(f,d){cons.push(fs.orderBy(f,d));return o},
      limit:function(n){cons.push(fs.limit(n));return o},
      onSnapshot:function(cb,err){var q=fs.query.apply(null,[fs.collection(db,base+c)].concat(cons));
        return fs.onSnapshot(q,function(x){cb({docs:x.docs.map(function(d){return{id:d.id,data:function(){return d.data()}}})})},err)}};return o}
  }
}
function initSync(){
  var code=getCode();if(!code||!cfgOk())return;
  Promise.all([import(FBU+'firebase-app.js'),import(FBU+'firebase-auth.js'),import(FBU+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(window.NID_CONFIG),au=m[1],fs=m[2];
    var db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
    var a=au.getAuth(app);
    return a.authStateReady().then(function(){return a.currentUser||au.signInAnonymously(a)}).then(function(){DB=makeDB(fs,db,code);start()});
  }).catch(function(e){fail(e);render()});
}
function viewFoyer(){
  var code=getCode(),h='<h1>Foyer</h1><p class="sub">Réglages de la synchronisation entre vos téléphones.</p>';
  if(!cfgOk())return h+'<div class="status"><p>La synchronisation n’est pas encore configurée : il manque les identifiants Firebase dans le fichier config.js.</p></div><button class="ghost" data-tab="bebe">← Retour</button>';
  if(!code){
    h+='<div class="status"><p><b>Premier téléphone ?</b> Créez le foyer : vos données actuelles seront envoyées dans la base partagée.</p></div><button class="pri" data-mkfoyer="1">Créer le foyer</button>';
    h+='<h2>Rejoindre un foyer existant</h2><p class="sub">Collez le code ou le lien reçu de votre partenaire.</p><div class="add"><input id="joincode" placeholder="Code du foyer" data-enter="joinfoyer" autocapitalize="off" autocomplete="off" autocorrect="off"><button data-joinfoyer="1">Rejoindre</button></div>';
  }else{
    h+='<div class="status"><p>Foyer connecté.</p><p>Code : <b>'+esc(code)+'</b></p><p class="sub" style="margin:8px 0 6px">Ne le publiez pas : toute personne qui l’a accède à vos données.</p><input class="ein" id="invite" readonly style="width:100%" value="'+esc(location.origin+location.pathname+'#foyer='+code)+'"></div><button class="pri" data-copyinvite="1">Copier le lien</button> <button class="ghost" data-leave="1">Quitter ce foyer</button>';
  }
  return h+'<p><button class="ghost" data-tab="bebe">← Retour</button></p>';
}
(function(){var m=(location.hash||'').match(/^#foyer=([A-Za-z0-9_-]{16,})$/);if(m){setCode(m[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}})();
initSync();
function load(){try{var r=localStorage.getItem(KEY);if(r)return Object.assign({},DEFAULT,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(DEFAULT))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hm(ts){var d=new Date(ts);return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function ago(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'à l’instant';if(m<60)return 'il y a '+m+' min';var h=Math.floor(m/60);return 'il y a '+h+' h '+(m%60<10?'0':'')+(m%60)}
function last(type){for(var i=S.baby.length-1;i>=0;i--)if(S.baby[i].t===type)return S.baby[i];return null}
function today(){var s=new Date();s.setHours(0,0,0,0);return S.baby.filter(function(e){return e.ts>=s.getTime()})}

var LABEL={biberon:'🍼 Biberon',couche:'💧 Couche',dodo:'😴 Endormi',reveil:'☀️ Réveil'};
var STEPS=[
['Avant la naissance',[
['a1','Reconnaissance anticipée en mairie (si non marié·e·s)'],
['a2','Choisir un pédiatre ou un médecin pour bébé'],
['a3','Chercher un mode de garde (crèche, assistante maternelle)'],
['a4','Prévenir l’employeur pour le congé de naissance'],
['a5','Préparer la valise de maternité'],
['a6','Installer le siège auto']]],
['Après la naissance',[
['b1','Déclarer la naissance en mairie (sous 5 jours)'],
['b2','Ajouter bébé à la mutuelle'],
['b3','Déclarer bébé à la CPAM (carte Vitale)'],
['b4','Informer la CAF (prime à la naissance, PAJE)'],
['b5','Examen médical du 8e jour'],
['b6','Premiers vaccins (vers 2 mois)']]]];

var MEALS=[
{id:'m1',n:'Pâtes bolognaise',i:['Pâtes','Viande hachée','Tomates concassées','Oignons','Parmesan']},
{id:'m2',n:'Poulet rôti et pommes de terre',i:['Poulet','Pommes de terre','Ail','Huile d’olive']},
{id:'m3',n:'Soupe de légumes',i:['Carottes','Poireaux','Pommes de terre','Bouillon de légumes']},
{id:'m4',n:'Omelette et salade',i:['Œufs','Salade verte','Tomates']},
{id:'m5',n:'Riz sauté aux légumes',i:['Riz','Courgettes','Carottes','Œufs','Sauce soja']},
{id:'m6',n:'Saumon et haricots verts',i:['Pavés de saumon','Haricots verts','Citron','Riz']},
{id:'m7',n:'Gratin de courgettes',i:['Courgettes','Crème fraîche','Gruyère râpé','Œufs']},
{id:'m8',n:'Quiche lorraine',i:['Pâte brisée','Lardons','Œufs','Crème fraîche']},
{id:'m9',n:'Croque-monsieur',i:['Pain de mie','Jambon','Gruyère râpé','Beurre']},
{id:'m10',n:'Lentilles et saucisses',i:['Lentilles','Saucisses','Carottes','Oignons']}];
function migrate(){if(S.todo)return;S.todo=[];STEPS.forEach(function(g,gi){g[1].forEach(function(s){S.todo.push({id:s[0],g:gi?'apres':'avant',text:s[1],done:!!S.steps[s[0]]})})});save()}
function allMeals(){return MEALS.concat(S.custom)}
function viewMeals(){
  var h='<h1>Repas</h1><p class="sub">Cochez les repas de la semaine : la liste de courses se crée toute seule.</p>';
  var list=allMeals();
  list.forEach(function(m){var on=S.meals.indexOf(m.id)>-1;
    h+='<div class="row'+(on?' sel':'')+'"><button class="chk" data-meal="'+m.id+'" aria-label="Choisir">'+(on?'✓':'')+'</button><span class="t">'+esc(m.n)+'<span class="sm">'+esc(m.i.join(', '))+'</span></span>'+(m.c?'<button class="del" data-delmeal="'+m.id+'" aria-label="Supprimer">×</button>':'')+'</div>'});
  h+='<h2>Ajouter un repas</h2><div class="add"><input id="mname" placeholder="Nom du repas" maxlength="60" data-enter="addmeal"></div><div class="add"><input id="mings" placeholder="Ingrédients, séparés par des virgules" maxlength="200" data-enter="addmeal"><button data-addmeal="1">Ajouter</button></div>';
  var items={};
  S.meals.forEach(function(id){var m=list.filter(function(x){return x.id===id})[0];if(!m)return;m.i.forEach(function(x){var k=x.trim().toLowerCase();if(!items[k])items[k]={n:x.trim(),c:0};items[k].c++})});
  var keys=Object.keys(items).sort(function(a,b){return a.localeCompare(b,'fr')});
  h+='<h2>Liste de courses</h2>';
  if(!keys.length)h+='<p class="empty">Choisissez au moins un repas pour voir la liste.</p>';
  keys.forEach(function(k){var d=S.shop[k];h+='<div class="row'+(d?' done':'')+'"><button class="chk" data-shop="'+esc(k)+'" aria-label="Dans le panier">'+(d?'✓':'')+'</button><span class="t">'+esc(items[k].n)+(items[k].c>1?'<span class="sm">pour '+items[k].c+' repas</span>':'')+'</span></div>'});
  if(S.meals.length)h+='<button class="ghost" data-clearmeals="1">Vider la sélection</button>';
  return h;
}
function render(){migrate();setTimeout(function(){var fi=document.getElementById(pend?'qty':'editin');if(fi)fi.focus()},0);
  var h='';
  h=({bebe:viewBaby,maison:viewHome,repas:viewMeals,demarches:viewSteps,foyer:viewFoyer,stats:viewStats,sante:viewCare}[S.tab]||viewBaby)();
  h+='<button class="ghost" style="margin-top:28px" data-tab="foyer">'+(sErr?'⚠️ Erreur de synchronisation, réessayez plus tard':DB?(ready?'🔄 Synchronisé entre vos appareils':'⏳ Connexion…'):'📴 Mode local : données non partagées')+' · Réglages</button>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===S.tab)});
}
function sleepToday(){var s=new Date();s.setHours(0,0,0,0);var m0=s.getTime(),now=Date.now(),tot=0,st=null;
  S.baby.forEach(function(e){if(e.t==='dodo'){st=e.ts}else if(e.t==='reveil'&&st!==null){tot+=Math.max(0,Math.min(e.ts,now)-Math.max(st,m0));st=null}});
  if(st!==null)tot+=Math.max(0,now-Math.max(st,m0));return tot}
function dur(ms){var m=Math.round(ms/60000);return Math.floor(m/60)+' h '+(m%60<10?'0':'')+(m%60)}
function mlToday(){return today().reduce(function(a,e){return a+(e.t==='biberon'&&e.ml?e.ml:0)},0)}
function viewBaby(){
  var f=last('biberon'),c=last('couche'),s=last('dodo'),r=last('reveil');
  var asleep=s&&(!r||s.ts>r.ts);
  var td=today();
  var cnt=function(t){return td.filter(function(e){return e.t===t}).length};
  var h='<h1>Bébé</h1><p class="sub">Un appui, c’est noté pour vous deux.</p><button class="ghost" style="margin:0 0 12px" data-night="1">🌙 Mode nuit : '+nightLabel()+'</button><div class="status">';
  h+='<p>🍼 Dernier biberon : <b>'+(f?ago(f.ts)+(f.ml?' · '+f.ml+' ml':''):'pas encore noté')+'</b></p>';
  h+='<p>💧 Dernière couche : <b>'+(c?ago(c.ts):'pas encore notée')+'</b></p>';
  h+='<p>'+(asleep?'😴 Dort depuis <b>'+ago(s.ts).replace('il y a ','')+'</b>':'☀️ Éveillé'+(r?' depuis <b>'+ago(r.ts).replace('il y a ','')+'</b>':''))+'</p>';
  h+='<p>😴 Sommeil aujourd’hui : <b>'+dur(sleepToday())+'</b></p>';h+='<p style="color:var(--mute);margin-top:8px">Aujourd’hui : '+cnt('biberon')+' biberon'+(cnt('biberon')>1?'s':'')+' ('+mlToday()+' ml) · '+cnt('couche')+' couche'+(cnt('couche')>1?'s':'')+'</p></div>';
  if(pend){var dv=f&&f.ml?f.ml:90;h+='<div class="status"><p><b>Quantité du biberon</b></p><div class="qrow">'+[60,90,120,150].map(function(q){return '<button class="ghost" data-q="'+q+'">'+q+'</button>'}).join('')+'<input id="qty" type="number" inputmode="numeric" min="10" max="400" value="'+dv+'" data-enter="savefeed" aria-label="Quantité en ml"><span>ml</span></div><button class="pri" data-savefeed="1">Enregistrer</button> <button class="ghost" data-cancelfeed="1">Annuler</button></div>'}
  h+='<div class="big"><button class="feed" data-feed="1"><span>🍼</span>Biberon</button><button data-log="couche"><span>💧</span>Couche</button>';
  h+=asleep?'<button data-log="reveil"><span>☀️</span>Réveil</button>':'<button data-log="dodo"><span>😴</span>Dodo</button>';
  h+='<button data-undo="1"><span>↩️</span>Annuler le dernier</button></div>';
  h+='<button class="ghost" data-tab="stats">📊 Statistiques de la semaine</button><h2>Journal du jour</h2>';
  if(!td.length)h+='<p class="empty">Rien pour l’instant. Appuyez sur un bouton pour commencer.</p>';
  td.slice().reverse().forEach(function(e){h+='<div class="row"><span class="time">'+hm(e.ts)+'</span><span class="t">'+LABEL[e.t]+(e.ml?' · '+e.ml+' ml':'')+'</span></div>'});
  return h;
}
function nightMode(){try{return localStorage.getItem('nid-night')||'off'}catch(e){return 'off'}}
function nightLabel(){return {off:'désactivé',on:'activé',auto:'auto, de 22 h à 7 h'}[nightMode()]}
function cycleNight(){var n={off:'on',on:'auto',auto:'off'}[nightMode()];try{localStorage.setItem('nid-night',n)}catch(e){}applyNight()}
function applyNight(){var m=nightMode(),h=new Date().getHours(),on=m==='on'||(m==='auto'&&(h>=22||h<7)),r=document.documentElement;
  if(on)r.setAttribute('data-theme','night');else if(r.getAttribute('data-theme')==='night')r.removeAttribute('data-theme');
  var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute('content',on?'#0A0604':'#2B7A74')}
function dayStart(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d.getTime()}
function statsDays(){
  var iv=[],st=null,out=[];
  S.baby.forEach(function(e){if(e.t==='dodo')st=e.ts;else if(e.t==='reveil'&&st!==null){iv.push([st,e.ts]);st=null}});
  if(st!==null)iv.push([st,Date.now()]);
  for(var n=6;n>=0;n--){
    var a=dayStart(n),b=dayStart(n-1),sl=0,ev=S.baby.filter(function(e){return e.ts>=a&&e.ts<b});
    iv.forEach(function(q){sl+=Math.max(0,Math.min(q[1],b)-Math.max(q[0],a))});
    var fe=ev.filter(function(e){return e.t==='biberon'});
    out.push({lab:new Date(a).toLocaleDateString('fr-FR',{weekday:'short'}),sl:sl,ml:fe.reduce(function(x,e){return x+(e.ml||0)},0),c:ev.filter(function(e){return e.t==='couche'}).length,has:ev.length>0});
  }
  return out;
}
function bars(days,key,cls,fmt){
  var mx=Math.max.apply(null,days.map(function(d){return d[key]}))||1,h='';
  days.forEach(function(d){h+='<div class="srow"><span>'+d.lab+'</span><div><div class="sbar '+cls+'" style="width:'+Math.max(2,Math.round(d[key]/mx*100))+'%"></div></div><span class="sv">'+fmt(d[key])+'</span></div>'});
  return h;
}
function avg(arr,key){return arr.length?arr.reduce(function(a,d){return a+d[key]},0)/arr.length:0}
function viewStats(){
  var days=statsDays(),h='<h1>Statistiques</h1><p class="sub">Les 7 derniers jours. Indicatif, ce n’est pas un avis médical.</p>';
  if(!days.some(function(d){return d.has}))return h+'<p class="empty">Pas encore de données : notez quelques biberons et siestes.</p><button class="ghost" data-tab="bebe">← Retour</button>';
  var full=days.slice(0,6).filter(function(d){return d.has});if(!full.length)full=days.filter(function(d){return d.has});
  var fd=S.baby.filter(function(e){return e.t==='biberon'&&e.ts>=dayStart(6)}),gaps=[];
  for(var i=1;i<fd.length;i++){var g=fd[i].ts-fd[i-1].ts;if(g<12*36e5)gaps.push(g)}
  h+='<div class="status"><p>Moyenne par jour : <b>'+dur(avg(full,'sl'))+'</b> de sommeil · <b>'+Math.round(avg(full,'ml'))+' ml</b> de lait · <b>'+Math.round(avg(full,'c'))+'</b> couches</p>';
  if(gaps.length)h+='<p>Intervalle moyen entre biberons : <b>'+dur(gaps.reduce(function(a,b){return a+b},0)/gaps.length)+'</b></p>';
  h+='</div><h2>Sommeil</h2>'+bars(days,'sl','',dur)+'<h2>Lait (ml)</h2>'+bars(days,'ml','w',function(v){return v+' ml'})+'<h2>Couches</h2>'+bars(days,'c','',function(v){return v});
  return h+'<p><button class="ghost" data-tab="bebe">← Retour</button></p>';
}

function addOff(b,o){var d=new Date(b+'T12:00:00');if(isNaN(d))d=new Date('2027-05-06T12:00:00');if(o.m){var day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+o.m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}if(o.d)d.setDate(d.getDate()+o.d);return d}
function fmtD(d){return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}
function rel(d){var n=Math.round((d-new Date().setHours(12,0,0,0))/864e5);return n===0?'aujourd’hui':n>0?'dans '+n+' j':'il y a '+(-n)+' j'}
function ageLab(o){return o.m?o.m+' mois':o.d===0?'Naissance':o.d===8?'Première semaine':'2e semaine'}
function viewCare(){
  var b=S.care.birth,dn=S.care.done||{};
  var h='<h1>Santé</h1><p class="sub">Vaccins, examens obligatoires et rendez-vous.</p>';
  h+='<p style="margin:0 0 6px"><b>Date de naissance</b> (prévue, à corriger après la naissance)</p><input type="date" id="birth" class="ein" style="width:100%" value="'+esc(b)+'">';
  var up=[];
  CARE.forEach(function(c){if(!dn[c.id])up.push({d:addOff(b,c.o),t:(c.k==='e'?'🩺 ':'💉 ')+c.t})});
  S.appts.forEach(function(a){if(!a.done&&a.date)up.push({d:new Date(a.date+'T12:00:00'),t:'📅 '+a.text})});
  up.sort(function(x,y){return x.d-y.d});
  h+='<h2>À venir</h2><div class="status">'+(up.length?up.slice(0,4).map(function(u){return '<p><b>'+fmtD(u.d)+'</b> ('+rel(u.d)+')<span class="sm">'+esc(u.t)+'</span></p>'}).join(''):'<p>Tout est fait. Bravo !</p>')+'</div>';
  h+='<h2>Rendez-vous</h2>';
  var ap=S.appts.slice().sort(function(x,y){return (x.date||'9')<(y.date||'9')?-1:1});
  if(!ap.length)h+='<p class="empty">Aucun rendez-vous. Ajoutez le pédiatre, la PMI, la sage-femme…</p>';
  ap.forEach(function(a){h+='<div class="row'+(a.done?' done':'')+'"><button class="chk" data-adone="'+esc(a.id)+'" aria-label="Fait">'+(a.done?'✓':'')+'</button><span class="t">'+esc(a.text)+(a.date?'<span class="sm">'+fmtD(new Date(a.date+'T12:00:00'))+'</span>':'')+'</span><button class="del" data-adel="'+esc(a.id)+'" aria-label="Supprimer">×</button></div>'});
  h+='<div class="add"><input id="atext" placeholder="Ex. Pédiatre, PMI…" maxlength="80" data-enter="addappt"></div><div class="add"><input type="date" id="adate" class="ein"><button data-addappt="1">Ajouter</button></div>';
  h+='<h2>Calendrier de bébé</h2><p class="sub">Calculé à partir de la date de naissance. Indicatif : le carnet de santé et votre médecin font foi.</p>';
  var last='';
  CARE.forEach(function(c){var key=JSON.stringify(c.o);
    if(key!==last){last=key;var d0=addOff(b,c.o);h+='<h2 style="margin-bottom:2px">'+ageLab(c.o)+'</h2><span class="sm" style="margin-bottom:8px">'+(c.w||'vers le')+' '+fmtD(d0)+' ('+rel(d0)+')</span>'}
    var d=!!dn[c.id];
    h+='<div class="row'+(d?' done':'')+'"><button class="chk" data-cdone="'+c.id+'" aria-label="Fait">'+(d?'✓':'')+'</button><span class="t">'+(c.k==='e'?'🩺 ':'💉 ')+c.t+'<span class="sm">'+(c.n||(c.k==='e'?'Examen obligatoire':c.reco?'Recommandé':'Vaccin obligatoire'))+'</span></span></div>'});
  return h;
}
function viewHome(){
  var h='<h1>Maison</h1><p class="sub">Qui fait quoi, d’un coup d’œil.</p>';
  var open=S.tasks.filter(function(t){return !t.done}).length;
  h+='<div class="status"><p><b>'+open+'</b> tâche'+(open>1?'s':'')+' à faire</p></div>';
  if(!S.tasks.length)h+='<p class="empty">Aucune tâche. Ajoutez la première ci-dessous.</p>';
  S.tasks.forEach(function(t){
    h+='<div class="row'+(t.done?' done':'')+'"><button class="chk" data-done="'+t.id+'" aria-label="Terminé">'+(t.done?'✓':'')+'</button><span class="t">'+esc(t.text)+'</span><button class="who '+t.who+'" data-who="'+t.id+'" aria-label="Changer de responsable">'+(t.who==='moi'?'Tom':'Clara')+'</button><button class="del" data-del="'+t.id+'" aria-label="Supprimer">×</button></div>';
  });
  h+='<div class="add"><input id="newtask" placeholder="Nouvelle tâche" maxlength="80"><button data-add="1">Ajouter</button></div>';
  h+='<button class="ghost" data-reset="1">Décocher tout pour la semaine</button>';
  return h;
}
function viewSteps(){
  var tot=S.todo.length,ok=S.todo.filter(function(x){return x.done}).length;
  var h='<h1>Démarches</h1><p class="sub">'+ok+' sur '+tot+' faites. Adaptez la liste à votre situation.</p><div class="prog"><i style="width:'+(tot?Math.round(ok/tot*100):0)+'%"></i></div>';
  [['avant','Avant la naissance'],['apres','Après la naissance']].forEach(function(g){
    h+='<h2>'+g[1]+'</h2>';
    S.todo.filter(function(x){return x.g===g[0]}).forEach(function(x){
      if(editing===x.id)h+='<div class="row"><input class="ein" id="editin" value="'+esc(x.text)+'" maxlength="120" data-enter="saveedit"><button class="pri" data-saveedit="'+x.id+'">OK</button></div>';
      else h+='<div class="row'+(x.done?' done':'')+'"><button class="chk" data-step="'+x.id+'" aria-label="Fait">'+(x.done?'✓':'')+'</button><span class="t">'+esc(x.text)+'</span><button class="del" data-edit="'+x.id+'" aria-label="Modifier">✏️</button><button class="del" data-delstep="'+x.id+'" aria-label="Supprimer">×</button></div>'});
  });
  h+='<h2>Ajouter une démarche</h2><div class="add"><select id="newgrp" aria-label="Moment"><option value="avant">Avant</option><option value="apres">Après</option></select><input id="newstep" placeholder="Nouvelle démarche" maxlength="120" data-enter="addstep"><button data-addstep="1">Ajouter</button></div>';

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.tab){S.tab=d.tab;pend=false;editing=null}
  else if(d.feed){pend=true}
  else if(d.q){document.getElementById('qty').value=d.q;return}
  else if(d.savefeed){var ml=parseInt(document.getElementById('qty').value,10);if(!(ml>0))return;S.baby.push({t:'biberon',ts:Date.now(),ml:ml});pend=false}
  else if(d.cancelfeed){pend=false}
  else if(d.mkfoyer){save();setCode(newCode());location.reload();return}
  else if(d.joinfoyer){var jc=document.getElementById('joincode').value.trim().replace(/^.*foyer=/,'');if(jc.length<16)return;save();setCode(jc);location.reload();return}
  else if(d.copyinvite){var iv=document.getElementById('invite');iv.select();try{navigator.clipboard.writeText(iv.value)}catch(x){}return}
  else if(d.leave){setCode('');location.reload();return}
  else if(d.night){cycleNight()}
  else if(d.cdone){S.care.done[d.cdone]=!S.care.done[d.cdone]}
  else if(d.adone){S.appts.forEach(function(x){if(x.id===d.adone)x.done=!x.done})}
  else if(d.adel){S.appts=S.appts.filter(function(x){return x.id!==d.adel})}
  else if(d.addappt){var at=document.getElementById('atext').value.trim();if(!at)return;S.appts.push({id:'r'+Date.now(),text:at,date:document.getElementById('adate').value||'',done:false})}
  else if(d.log)S.baby.push({t:d.log,ts:Date.now()});
  else if(d.undo)S.baby.pop();
  else if(d.done){S.tasks.forEach(function(t){if(t.id==d.done)t.done=!t.done})}
  else if(d.who){S.tasks.forEach(function(t){if(t.id==d.who)t.who=t.who==='moi'?'elle':'moi'})}
  else if(d.del){S.tasks=S.tasks.filter(function(t){return t.id!=d.del})}
  else if(d.add){var i=document.getElementById('newtask'),v=i.value.trim();if(!v)return;S.tasks.push({id:Date.now(),text:v,who:'moi',done:false})}
  else if(d.reset){S.tasks.forEach(function(t){t.done=false})}
  else if(d.step){S.todo.forEach(function(x){if(x.id===d.step)x.done=!x.done})}
  else if(d.edit){editing=d.edit}
  else if(d.saveedit){var v1=document.getElementById('editin').value.trim();if(v1)S.todo.forEach(function(x){if(x.id===d.saveedit)x.text=v1});editing=null}
  else if(d.delstep){S.todo=S.todo.filter(function(x){return x.id!==d.delstep})}
  else if(d.addstep){var v2=document.getElementById('newstep').value.trim();if(!v2)return;S.todo.push({id:'x'+Date.now(),g:document.getElementById('newgrp').value,text:v2,done:false})}
  else if(d.meal){var ix=S.meals.indexOf(d.meal);if(ix>-1)S.meals.splice(ix,1);else S.meals.push(d.meal)}
  else if(d.shop){S.shop[d.shop]=!S.shop[d.shop]}
  else if(d.addmeal){var mn=document.getElementById('mname').value.trim(),mi=document.getElementById('mings').value.split(',').map(function(x){return x.trim()}).filter(Boolean);if(!mn||!mi.length)return;var mid='c'+Date.now();S.custom.push({id:mid,n:mn,i:mi,c:true});S.meals.push(mid)}
  else if(d.delmeal){S.custom=S.custom.filter(function(x){return x.id!==d.delmeal});S.meals=S.meals.filter(function(x){return x!==d.delmeal})}
  else if(d.clearmeals){S.meals=[];S.shop={}}
  else return;
  save();sync();render();
});

applyNight();
setInterval(function(){applyNight();if(S.tab==='bebe'&&!pend&&!document.activeElement.matches('input'))render()},60000);
